<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disponibilidade de Lançamentos — Ilha Pura (MVP)</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6f9,#0f1216);--panel:light-dark(#fff,#181c22);--panel2:light-dark(#eef1f5,#20262e);--txt:light-dark(#1a1d22,#e7ecf2);--muted:light-dark(#5b6570,#9aa6b2);--line:light-dark(#dfe4ea,#2a323c);--accent:light-dark(#0b5cad,#4aa3ff);--danger:#c0392b;--ok:#2e7d32;--warn:#e08600}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
header .sp{flex:1}
select,input,button,textarea{font:inherit;color:var(--txt)}
select,input,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
button.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
button.sm{padding:4px 8px;font-size:12px}
button.warnb{background:var(--warn)}
button:disabled{opacity:.45;cursor:not-allowed}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--danger)}
nav{display:flex;gap:4px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:transparent;color:var(--muted);border-radius:6px;padding:7px 12px}
nav button.on{background:var(--panel2);color:var(--txt);font-weight:600}
main{padding:14px;max-width:1500px;margin:0 auto}
.info{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;margin:12px auto;max-width:1500px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{min-width:110px}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}
th{background:var(--panel2);color:var(--muted);font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.lockpill{font-size:11px;color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ucard{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;background:var(--panel)}
.grid-tv{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.tower{flex:1;min-width:300px}
.tower h3{text-align:center;margin:0 0 8px;padding:6px;background:var(--panel2);border-radius:6px}
.floor{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.floor .fl{width:34px;text-align:center;color:var(--muted);font-size:11px;font-weight:700}
.cells{display:grid;gap:4px;flex:1}
.cell{border-radius:5px;padding:4px 3px;text-align:center;font-size:11px;line-height:1.15;overflow:hidden}
.cell b{font-size:12px;display:block}
.cell .t{opacity:.92;font-size:10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .n{font-size:26px;font-weight:800}
.kpi .l{color:var(--muted);font-size:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.cols2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h4{margin:0 0 10px}
.b-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.b-row .lab{width:170px;color:var(--muted);font-size:12px}
.b-row .track{flex:1;height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.b-row .fillb{height:100%;background:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:580px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.sheet h3{margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:10px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.form label.full{grid-column:1/3}
.reqmark{color:var(--danger)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:8px;color:#fff;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92%;font-size:13px}
.toast.error{background:var(--danger)}.toast.success{background:var(--ok)}.toast.info{background:var(--accent)}
.offline-banner{background:var(--danger);color:#fff;padding:8px;text-align:center;font-weight:700;border-radius:6px;margin-bottom:10px}
.kiosk header,.kiosk nav,.kiosk .info{display:none}
.kiosk main{max-width:none;padding:8px}
.hint{color:var(--muted);font-size:12px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;margin:2px}
code{background:var(--panel2);padding:1px 5px;border-radius:4px}

/* ---- MVP 2.0: chips, grade do operador, torre em destaque ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:#20262e;color:#dbe3ea;border:1px solid #2a323c;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.chip i{font-style:normal;opacity:.65;font-size:11px;margin-left:4px}
.chip.on{background:#2d6cdf;border-color:#2d6cdf;color:#fff}
.chip.hot{box-shadow:0 0 0 2px rgba(249,168,37,.45)}
.chip.qs{border-width:2px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa6b2;white-space:nowrap}
.gridop{background:#14181d;border-radius:10px;padding:10px}
.gridop .cells{display:grid;gap:4px;flex:1;grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.cellop{border:none;border-radius:7px;padding:7px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;font-family:inherit}
.cellop:hover{outline:2px solid #fff;transform:translateY(-1px)}
.cellop b{font-size:14px}.cellop span{font-size:10px;opacity:.85}
.tower.destaque{outline:2px solid #f9a825;border-radius:10px;padding:8px;background:#1a1710}
.tagl{background:#f9a825;color:#1a1a1a;font-style:normal;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;margin-right:8px;vertical-align:middle}
.tvtitle{text-align:center;font-size:20px;font-weight:800;letter-spacing:.5px;margin:4px 0 12px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}

.exitkiosk{position:fixed;top:10px;right:12px;z-index:9999;background:rgba(20,24,29,.82);
 color:#e8eef4;border:1px solid #3a444f;border-radius:20px;padding:8px 14px;font-size:12px;
 font-weight:700;cursor:pointer;opacity:.35;transition:opacity .15s}
.exitkiosk:hover{opacity:1;background:#c0392b;border-color:#c0392b}
</style></head><body>

function fimDeSemanaPadrao(){
 var d=new Date();var dow=d.getDay();var sex=new Date(d);
 sex.setDate(d.getDate()-((dow+2)%7));            /* sexta da semana corrente */
 var dom=new Date(sex);dom.setDate(sex.getDate()+2);
 if(d>dom)dom=d;                                  /* nunca esconder o que foi feito hoje */
 var f=function(x){return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());};
 return [f(sex),f(dom)];
}

function openEdit(chave){
 var u=unitByKey(chave);if(!u){F.editing=null;return;}
 var p=perms();F.editing=chave;var sm=stMap();var s=sm[u.status]||{};var canEdit=p.edit;var personal=p.seePersonal;
 var allowed=[u.status].concat((D.transitions[u.status]||[]));
 var old=document.getElementById("ovl");if(old)old.remove();
 var ovl=document.createElement("div");ovl.className="modal";ovl.id="ovl";var c=u.comercial||{};
 var fld=function(k,lab,tp){var v=c[k]||"";if(k==="horaReserva"&&!v&&canEdit)v=agoraLocal();return '<label class="'+(k==="cliente"?"full":"")+'">'+lab+'<input '+(tp?'type="'+tp+'" ':"")+'data-c="'+k+'" value="'+esc(v)+'" '+(canEdit?"":"disabled")+'></label>';};
 var b='<div class="sheet"><h3>'+esc(u.chave)+' · '+esc(u.blockName)+'</h3><div class="hint">'+esc(u.tipologia)+' · '+u.m2+'m² · '+u.vagas+' vaga(s) · '+(u.andarTipo==="Cobertura"?"Cobertura":u.floor+"º andar")+' · versão <b>v'+u.versao+'</b>'+(u.lock?' · <span class="lockpill">em edição por '+esc(u.lock.operador)+'</span>':"")+'</div>';
 b+='<div style="margin:10px 0"><span class="badge" style="background:'+(s.cor_fundo||"#888")+';color:'+(s.cor_texto||"#fff")+'">'+esc(u.status)+'</span></div>';
 if(canEdit){b+='<div class="quick">'+["Reservada","Em Negociação","Pix Validado","Vendido","Disponível"].filter(function(x){return allowed.indexOf(x)>=0;}).map(function(x){var sc=(stMap()[x]||{});return '<button type="button" class="chip qs" data-qs="'+esc(x)+'" style="border-color:'+(sc.cor_fundo||"#888")+'">'+esc(x)+'</button>';}).join("")+'</div>';
 b+='<label>Novo status<select id="e_status">'+allowed.map(function(x){return '<option'+(x===u.status?" selected":"")+'>'+x+'</option>';}).join("")+'</select></label><div id="e_reqnote" class="hint" style="margin:6px 0"></div>';}
 if(personal){b+='<div class="form">'+fld("cliente","Cliente")+fld("corretor","Corretor")+fld("imobiliaria","Imobiliária")+fld("gerencia","Gerente")+fld("horaReserva","Hora da reserva","datetime-local")+fld("idProposta","ID Proposta")+fld("diretoria","Diretoria")+fld("senha","Senha")+'</div>';}
 else{b+='<div class="hint">Seu perfil não visualiza dados comerciais/pessoais.</div>';}
 if(canEdit){b+='<label class="full" style="margin-top:8px">Justificativa (reversão/ação crítica)<input id="e_just" placeholder="obrigatória para reversões"></label><label class="full"><span id="e_confwrap" style="display:none"><input type="checkbox" id="e_conf"> Confirmo esta alteração crítica</span></label>';}
 b+='<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap"><button class="ghost" id="e_close">Fechar</button>';
 if(canEdit)b+='<button class="warnb" id="e_sim">Simular acesso simultâneo</button>';
 if(p.revert&&u.status!=="Disponível")b+='<button class="ghost" id="e_rev">Reverter → Disponível</button>';
 if(canEdit)b+='<button class="ghost" id="e_lock">Assumir edição</button><button id="e_save">Salvar</button>';
 b+='</div></div>';ovl.innerHTML=b;document.body.appendChild(ovl);
 ovl.onclick=function(e){if(e.target===ovl){F.editing=null;ovl.remove();}};
 document.getElementById("e_close").onclick=function(){F.editing=null;ovl.remove();};
 if(canEdit){
  var rq=function(){var tgt=document.getElementById("e_status").value;var req=(D.requiredFields[tgt]||[]);document.getElementById("e_reqnote").innerHTML=req.length?"Obrigatórios: "+req.map(function(r){return '<b>'+r+'</b>';}).join(", "):"Sem campos obrigatórios.";var crit=(D.criticalStatuses||[]).indexOf(tgt)>=0&&tgt!==u.status;document.getElementById("e_confwrap").style.display=crit?"inline":"none";};
  document.getElementById("e_status").onchange=rq;rq();
  Array.prototype.forEach.call(ovl.querySelectorAll("[data-qs]"),function(b2){b2.onclick=function(){document.getElementById("e_status").value=b2.dataset.qs;rq();};});
  document.getElementById("e_lock").onclick=function(){call("begin_edit",{chave:u.chave});};
  document.getElementById("e_sim").onclick=function(){F.editing=null;ovl.remove();call("simulate_conflict",{chave:u.chave});};
  document.getElementById("e_save").onclick=function(){var com={};Array.prototype.forEach.call(ovl.querySelectorAll("[data-c]"),function(i){com[i.dataset.c]=i.value;});call("update_unit",{chave:u.chave,novo_status:document.getElementById("e_status").value,comercial:com,versao_esperada:u.versao,justificativa:document.getElementById("e_just").value,confirmCritico:document.getElementById("e_conf")?document.getElementById("e_conf").checked:false,origem:"Painel Web / "+UI.role});F.editing=null;ovl.remove();};
 }
 var rev=document.getElementById("e_rev");if(rev)rev.onclick=function(){var j=prompt("Justificativa da reversão para Disponível:");if(j){call("revert_status",{chave:u.chave,novo_status:"Disponível",de:u.status,justificativa:j});F.editing=null;ovl.remove();}};
}
function openExport(csv,count,pers){
 var old=document.getElementById("ovl2");if(old)old.remove();
 var ovl=document.createElement("div");ovl.className="modal";ovl.id="ovl2";
 ovl.innerHTML='<div class="sheet"><h3>Exportação CSV</h3><div class="hint">'+count+' linhas'+(pers?"":" · sanitizado (sem dados pessoais)")+' · base_disponibilidade.csv</div><textarea style="width:100%;height:300px;margin-top:8px" readonly>'+esc(csv)+'</textarea><div style="text-align:right;margin-top:10px"><button id="x_close">Fechar</button></div></div>';
 document.body.appendChild(ovl);ovl.onclick=function(e){if(e.target===ovl)ovl.remove();};document.getElementById("x_close").onclick=function(){ovl.remove();};
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&UI.kiosk){call("set_kiosk",{value:false});}});
render();
</script></body></html>
